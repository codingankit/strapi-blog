packages:
  - apps/*
  - packages/*
allowBuilds:
  "@swc/core": true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  react-redux: "^9.1.2"
  "@uiw/react-codemirror": "^4.23.0"
  typedoc: "^0.27.0"
  zod: "^3.24.2"
  "@types/koa": "3.0.3"
peerDependencyRules:
  ignoreMissing:
    - "@types/react"
    - "codemirror"
    - "typescript"
    - "redux"
  allowAny:
    - "@types/react"
    - "typescript"
    - "redux"
    - "codemirror"
